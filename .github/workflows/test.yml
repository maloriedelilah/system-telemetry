name: test

# Runs on every PR and on pushes to main. The roll-up job `test` is the one to mark
# as required in the branch ruleset: it fails if any job before it failed or was skipped.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install runtime dependencies (the hashed lock, as boxes do)
        run: pip install --require-hashes --no-deps -r requirements.lock
      - name: The lock pins every requirement in requirements.txt
        run: |
          for name in $(grep -Eo '^[A-Za-z0-9_.-]+' requirements.txt); do
            grep -qiE "^${name}==" requirements.lock || { echo "::error::$name is in requirements.txt but not pinned in requirements.lock"; exit 1; }
          done
      - name: Every module compiles and imports
        run: |
          python -m compileall -q telemetry tests
          for m in telemetry/*.py; do
            name="$(basename "$m" .py)"
            [ "$name" = "__main__" ] && continue   # importing it would start a telemetry run
            python -c "import telemetry.${name}"
          done
      - name: Tests (each file is a standalone script; exit status is the verdict)
        run: |
          set -e
          for t in tests/test_*.py; do
            echo "== $t"
            python "$t"
          done

  shell:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Syntax
        run: for f in *.sh; do bash -n "$f"; done
      - name: update.sh against a local repo standing in for GitHub
        run: sudo bash tests/test_update.sh
      - name: autoupdate.sh (the unattended updater, OPS-75) against the same kind of stand-in
        run: sudo bash tests/test_autoupdate.sh
      - name: Every script is executable in git (100755)
        run: |
          bad="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" { print $4 }')"
          if [ -n "$bad" ]; then echo "::error::not 100755 in git: $bad (git update-index --chmod=+x <file>)"; exit 1; fi
      - name: shellcheck (the runner's version is the one that counts)
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -S warning *.sh
      - name: Windows wrappers (update.cmd, install.cmd)
        run: |
          # One file under two names, CRLF on checkout, and nothing after bash starts but the same line
          # (update.sh can rewrite update.cmd while cmd is still reading it).
          cmp update.cmd install.cmd
          for f in update.cmd install.cmd; do
            test "$(git check-attr eol -- "$f" | awk '{print $NF}')" = crlf || { echo "::error::$f isn't eol=crlf in .gitattributes"; exit 1; }
            n="$(grep -n '"%GITBASH%" -l' "$f" | cut -d: -f1)"
            grep -q '"%GITBASH%" -l "./%~n0.sh" %\* & exit /b' "$f" || { echo "::error::$f: the bash line must end with '& exit /b'"; exit 1; }
            test "$(sed -n "$((n + 1))p" "$f" | tr -d '\r')" = ":elevate" || { echo "::error::$f: only a label may follow the bash line"; exit 1; }
          done

  test:
    runs-on: ubuntu-24.04
    needs: [python, shell]
    if: always()
    steps:
      - run: |
          echo "python: ${{ needs.python.result }}, shell: ${{ needs.shell.result }}"
          test "${{ needs.python.result }}" = success && test "${{ needs.shell.result }}" = success
